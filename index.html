<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RedstartTech</title>
<meta property="og:title" content="RedstartTech">
<meta property="og:image" content="poster.jpg">
<style>
  :root { --paper:#DDD8C7; --ink:#242B2E; --reserve:7rem; }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body {
    margin:0; background:var(--paper); color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  /* width is whichever is smaller: the cap, the viewport, or what the
     viewport height can fit at 16:9 once the wordmark has its room */
  main {
    width:min(1120px, 94vw, calc((100vh - var(--reserve)) * 16 / 9));
    width:min(1120px, 94vw, calc((100dvh - var(--reserve)) * 16 / 9));
    display:flex; flex-direction:column; align-items:center;
    position:relative;
  }
  .frame { position:relative; width:100%; line-height:0; }
  /* dissolve the clip's edges into the page so the artwork it crops
     (mountain, leaves) fades out instead of being sliced by a hard border */
  .frame::after {
    content:""; position:absolute; inset:0; pointer-events:none; z-index:1;
    background:
      linear-gradient(to bottom, var(--paper), transparent 4%, transparent 96%, var(--paper)),
      linear-gradient(to right,  var(--paper), transparent 4%, transparent 96%, var(--paper));
  }
  /* the clip's own backdrop is --paper, so its edges vanish into the page */
  video, .frame img { display:block; width:100%; height:auto; aspect-ratio:16/9; }
  .frame img { display:none; }

  #wordmark { width:min(360px,52%); height:auto; margin-top:-1.2rem;
               position:relative; z-index:2; }
  #wordmark path { fill:var(--ink); }

  #sound {
    position:absolute; right:5.5%; bottom:10%; z-index:3;
    width:44px; height:44px; border:0; border-radius:50%; cursor:pointer;
    background:var(--ink); color:var(--paper);
    box-shadow:0 2px 10px rgba(36,43,46,.22);
    display:grid; place-items:center; padding:0;
    transition:background .18s ease, transform .18s ease;
  }
  #sound:hover { background:#3a444a; transform:scale(1.07); }
  #sound:focus-visible { outline:2px solid var(--ink); outline-offset:3px; }
  #sound svg { transform:translateX(-1px); }
  #sound svg { width:20px; height:20px; fill:none; stroke:currentColor;
                stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  #sound .waves { opacity:0; transition:opacity .18s ease; }
  #sound[aria-pressed="true"] .waves { opacity:1; }
  #sound .slash { opacity:1; transition:opacity .18s ease; }
  #sound[aria-pressed="true"] .slash { opacity:0; }

  /* readers who ask for less motion get the still frame instead */
  @media (prefers-reduced-motion: reduce) {
    video { display:none; }
    .frame img { display:block; }
    #sound { display:none; }
  }
  @media (max-width:600px) {
    :root { --reserve:5rem; }
    #wordmark { width:58%; margin-top:-0.6rem; }
    #sound { width:38px; height:38px; right:6%; bottom:9%; }
  }
</style>
</head>
<body>
<main>

    <video id="clip" autoplay muted loop playsinline preload="auto" poster="poster.jpg"

      <source src="bird.webm" type="video/webm">
      <source src="bird.mp4" type="video/mp4">
    </video>
    <img src="poster.jpg" alt="A redstart, the bird Redstart is named for">

        <g class="slash"><path d="M15.8 10.2l4 3.6"/><path d="M19.8 10.2l-4 3.6"/></g>
      </svg>
    </button>

</main>

<script>
  var clip = document.getElementById('clip');
  var btn  = document.getElementById('sound');
  var EVT  = ['pointerdown','keydown','touchstart'];

  btn.addEventListener('click', function (e) {
    e.stopPropagation();
    var turningOn = clip.muted;
    clip.muted = !turningOn;
    btn.setAttribute('aria-pressed', String(turningOn));
    btn.setAttribute('aria-label', turningOn ? 'Mute sound' : 'Play sound');
    clip.play().catch(function () {});          // this click also clears any autoplay block
  });

  // if the browser refuses even muted autoplay (iOS Low Power Mode, data savers),
  // start on the viewer's first interaction instead of sitting on a frozen frame
  function kick() { clip.play().then(drop).catch(function () {}); }
  function drop() { EVT.forEach(function (n) { document.removeEventListener(n, kick); }); }
  clip.play().then(drop).catch(function () {
    EVT.forEach(function (n) { document.addEventListener(n, kick, { passive:true }); });
  });
</script>
